# Continuous-integration gate. Runs on every push to main and on every
# pull request. Eight jobs cover the verification stack defined in
# `CONTRIBUTING.md`:
#
#   build-ts     — `npm run build` (= `tsc -b && vite build`). Strict
#                  type-check via tsconfig.app.json + tsconfig.node.json
#                  AND production bundler. Catches the kind of break where
#                  the build is silently broken while `tsc --noEmit`
#                  falsely returns 0 because the root tsconfig is
#                  references-only. Then
#                  `npm run check:bundle` gates the initial-paint asset
#                  size against accidental doubling.
#   test-ts      — `npx vitest run`. Runtime behaviour tests for the TS
#                  surface (~441 tests as of June 2026).
#   test-rust    — `cargo test --lib` inside `wasm-engine/`. Engine
#                  invariant tests (~1114 tests as of June 2026 incl.
#                  phase isolation + reference tests).
#   wasm-fresh   — committed-vs-fresh freshness gate. Dumps every creature's
#                  matchup summary from the committed bundle, rebuilds the wasm32
#                  bundle, dumps again, and fails if behaviour differs. Compares
#                  ENGINE OUTPUT, not bytes (wasm-pack output isn't byte-
#                  reproducible across OS), so it catches a committed bundle gone
#                  stale vs source — an engine edit without `npm run rust:build`.
#   lint-ts      — `npm run check:mojibake` (UTF-8->CP1251 corruption
#                  guard over tracked text) then `npm run lint`
#                  (= `eslint .`). Zero-warning gate.
#   lint-rust    — `cargo clippy --all-targets -- -D warnings` inside
#                  `wasm-engine/`. Zero-warning gate (lib + tests).
#   e2e          — `npm run test:e2e` (Playwright). Chromium smoke suite
#                  under `e2e/` against the Vite dev server: app boots,
#                  top-level navigation works, no WASM-unsupported gate.
#                  Browser is cached across runs; 2 retries absorb flake.
#   bundle-load  — `npm run test:bundle` (Playwright). Builds dist and cold-
#                  loads it many times via `vite preview` to catch production
#                  cross-chunk module-init races the dev-server e2e can't see.
#
# All jobs must succeed: lint is a hard gate (the codebase is lint-clean and must
# stay so), and wasm-fresh now blocks on committed-bundle staleness. The audit
# workflow (`audit.yml`) covers dependency-vulnerability checks separately.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Pushes land in bursts - dozens a day onto the same branch - and a run that has
# already been superseded keeps eight machines busy to tell us about a commit
# nobody is on any more. Cancel it: only the newest commit on a ref is worth a
# verdict, and the newest one still gets the full gate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ts:
    name: build (tsc -b + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: install
        run: npm ci
      - name: build
        run: npm run build
      - name: bundle-size guard
        run: npm run check:bundle

  test-ts:
    name: vitest (TS runtime tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: install
        run: npm ci
      - name: test
        run: npx vitest run

  test-rust:
    name: cargo test --lib
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasm-engine
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wasm-engine/Cargo.lock') }}
      - name: test
        run: cargo test --lib

  wasm-fresh:
    name: wasm freshness (committed == fresh rebuild)
    runs-on: ubuntu-latest
    # Committed-bundle staleness gate. src/rust-pkg/*.wasm is the shipped artifact
    # and nothing else in CI rebuilds it, so an engine edit landed without
    # `npm run rust:build` ships INERT — this already happened (Aftershock/
    # Aggressive went inert until a manual rebuild). wasm-pack output is not
    # byte-reproducible across OS (committed on Windows, CI on Linux), so a byte
    # diff false-positives; this compares BEHAVIOUR instead: dump every creature's
    # matchup summary from the committed bundle, rebuild fresh, dump again, fail if
    # they differ. Hard gate — a real staleness divergence must block. The two
    # dumps run in separate processes because a 2nd WASM instance corrupts the
    # bg.js memory view.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          targets: wasm32-unknown-unknown
      - name: cache cargo + wasm-pack
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            wasm-engine/target
          key: ${{ runner.os }}-wasmfresh-${{ hashFiles('wasm-engine/Cargo.lock') }}
      - name: install wasm-pack 0.14.0
        run: wasm-pack --version || cargo install wasm-pack --version 0.14.0 --locked
      - name: install npm deps
        run: npm ci
      - name: dump committed-bundle behaviour
        run: npx vitest run src/optimizer/wasmFreshness.test.ts
        env:
          WASM_FRESHNESS_DUMP: committed-summaries.json
      - name: rebuild wasm bundle
        run: npm run rust:build
      - name: dump fresh-bundle behaviour
        run: npx vitest run src/optimizer/wasmFreshness.test.ts
        env:
          WASM_FRESHNESS_DUMP: fresh-summaries.json
      - name: compare committed vs fresh
        run: node scripts/compare_wasm_summaries.mjs committed-summaries.json fresh-summaries.json

  lint-ts:
    name: eslint + mojibake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: mojibake guard
        run: npm run check:mojibake
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint

  lint-rust:
    name: cargo clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasm-engine
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm-engine/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('wasm-engine/Cargo.lock') }}
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: install
        run: npm ci
      - name: cache playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: e2e
        run: npm run test:e2e

  bundle-load:
    name: bundle load (built dist, cross-chunk init)
    runs-on: ubuntu-latest
    # The e2e job above runs against the Vite DEV server, which serves unbundled
    # ESM and therefore cannot see production chunk-init order. This job builds
    # the bundle and cold-loads it many times via `vite preview` to catch the
    # non-deterministic cross-chunk module-init race that crashed prod in 2026-06
    # (build + vitest + dev-server e2e all passed while it shipped). No retries
    # in the config on purpose - retrying would mask the flaky race.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: install
        run: npm ci
      - name: build
        run: npm run build
      - name: cache playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: bundle load gate
        # Dial the cold-load count up in CI: the init-order race that crashed prod
        # was low-frequency on bare "/", so a small sample can pass by luck.
        run: npm run test:bundle
        env:
          BUNDLE_RELOADS: "150"
